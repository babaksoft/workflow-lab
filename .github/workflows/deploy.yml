name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s' '${{ secrets.EC2_SSH_KEY }}' | tr -d '\r' > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          trap 'rm -f ~/.ssh/deploy.pem' EXIT

          ssh-keygen -y -f ~/.ssh/deploy.pem > /dev/null

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "Preparing deployment directories..."
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" \
            "mkdir -p /opt/workflow-lab/secrets && \
             chmod 700 /opt/workflow-lab/secrets"

          echo "Provisioning Docker secrets..."
          printf '%s' "$OPENAI_API_KEY" | \
            ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" \
            "cat > /opt/workflow-lab/secrets/openai_api_key.txt && \
             chmod 600 /opt/workflow-lab/secrets/openai_api_key.txt"

          printf '%s' "$AWS_BEARER_TOKEN_BEDROCK" | \
            ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" \
            "cat > /opt/workflow-lab/secrets/bedrock_api_key.txt && \
             chmod 600 /opt/workflow-lab/secrets/bedrock_api_key.txt"

          echo "Deploying image tag: $IMAGE_TAG"
          ssh -i ~/.ssh/deploy.pem "$EC2_USER@$EC2_HOST" \
            "cd /opt/workflow-lab && \
             IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml pull && \
             IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml up -d"

          echo "Deployment completed."

          rm -f ~/.ssh/deploy.pem


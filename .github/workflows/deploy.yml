name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ${{ vars.DEPLOY_PATH }}

            export IMAGE_TAG="${{ inputs.image_tag }}"

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d

            docker compose \
              --env-file .env \
              -f docker-compose.prod.yml \
              ps

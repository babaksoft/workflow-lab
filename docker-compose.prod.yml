services:

  api:
    image: ${DOCKERHUB_USERNAME}/workflow-lab-api:${IMAGE_TAG}

    container_name: workflow_api

    restart: unless-stopped

    environment:
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT_NAME: workflow-lab
      PHOENIX_ENABLED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LOG_DIR: /app/logs

    secrets:
      - openai_api_key
      - bedrock_api_key

    ports:
      - "8000:8000"

    volumes:
      - api-logs:/app/logs

    networks:
      - workflow-network

    depends_on:
      - phoenix

  app:
    image: ${DOCKERHUB_USERNAME}/workflow-lab-app:${IMAGE_TAG}

    container_name: workflow_app

    restart: unless-stopped

    environment:
      URL_PREFIX: http://api:8000/api/v1

    ports:
      - "8501:8501"

    networks:
      - workflow-network

    depends_on:
      - api

  prometheus:
    image: dhi.io/prometheus:3.11

    container_name: workflow_prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - workflow-network

    depends_on:
      - api

  grafana:
    image: dhi.io/grafana:13-debian13-dev

    container_name: workflow_grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    networks:
      - workflow-network

    depends_on:
      - prometheus

  phoenix:
    image: arizephoenix/phoenix:20.1.0

    container_name: workflow_phoenix

    restart: unless-stopped

    environment:
      PHOENIX_WORKING_DIR: /data

    ports:
      - "6006:6006"

    volumes:
      - phoenix-data:/data

    networks:
      - workflow-network


volumes:
  api-logs:
  prometheus-data:
  grafana-data:
  phoenix-data:


networks:
  workflow-network:

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt

  bedrock_api_key:
    file: ./secrets/bedrock_api_key.txt

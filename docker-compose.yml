services:

  api:
    build:
      context: .
      dockerfile: src/workflow_lab/api/Dockerfile

    container_name: workflow_api

    restart: unless-stopped

    environment:
      - LOG_DIR=/app/logs
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - PHOENIX_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_PROJECT_NAME=workflow-lab

    secrets:
      - openai_api_key
      - bedrock_api_key

    ports:
      - "8000:8000"

    networks:
      - workflow-network

  app:
    build:
      context: .
      dockerfile: src/workflow_lab/ui/Dockerfile

    container_name: workflow_app

    restart: unless-stopped

    environment:
      - URL_PREFIX=http://api:8000/api/v1

    ports:
      - "8501:8501"

    networks:
      - workflow-network

    depends_on:
      - api

  prometheus:
    image: dhi.io/prometheus:3.11
    container_name: workflow_prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - workflow-network

    depends_on:
      - api

  grafana:
    image: dhi.io/grafana:13-debian13-dev
    container_name: workflow_grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    networks:
      - workflow-network

    depends_on:
      - prometheus

  phoenix:
    image: arizephoenix/phoenix:20.1.0
    container_name: workflow_phoenix

    restart: unless-stopped

    ports:
      - "6006:6006"

    volumes:
      - phoenix-data:/data

    networks:
      - workflow-network

volumes:
  prometheus-data:
  grafana-data:
  phoenix-data:

networks:
  workflow-network:
    driver: bridge

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt

  bedrock_api_key:
    file: ./secrets/bedrock_api_key.txt
